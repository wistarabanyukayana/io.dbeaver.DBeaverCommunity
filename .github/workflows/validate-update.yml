name: Validate DBeaver update

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder grep coreutils sed tar xvfb curl

      - name: Collect concrete DBeaver release URLs
        id: urls
        shell: bash
        run: |
          mapfile -t all_urls < <(
            grep -Eo 'https://github\.com/dbeaver/dbeaver/releases/download/[0-9]+\.[0-9]+\.[0-9]+/[^" ]+' io.dbeaver.DBeaverCommunity.yml
          )

          printf 'ALL_URL=%s\n' "${all_urls[@]}"

          mapfile -t app_urls < <(
            printf '%s\n' "${all_urls[@]}" | grep -E 'dbeaver-ce-.*(x86_64|aarch64).*(\.tar\.gz)$'
          )

          printf 'APP_URL=%s\n' "${app_urls[@]}"

          test "${#app_urls[@]}" -ge 2
          printf '%s\n' "${app_urls[@]}" | grep -q 'x86_64'
          printf '%s\n' "${app_urls[@]}" | grep -q 'aarch64'

          {
            printf 'all_urls<<EOF\n'
            printf '%s\n' "${all_urls[@]}"
            printf 'EOF\n'
            printf 'app_urls<<EOF\n'
            printf '%s\n' "${app_urls[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Validate URL version consistency
        shell: bash
        env:
          APP_URLS: ${{ steps.urls.outputs.app_urls }}
        run: |
          mapfile -t app_urls <<< "$APP_URLS"

          versions=$(
            printf '%s\n' "${app_urls[@]}" \
              | sed -E 's#.*/download/([0-9]+\.[0-9]+\.[0-9]+)/.*#\1#' \
              | sort -u
          )

          echo "Detected app URL versions:"
          printf '%s\n' "$versions"

          test "$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)" -eq 1

      - name: Validate URLs are fetchable
        shell: bash
        env:
          ALL_URLS: ${{ steps.urls.outputs.all_urls }}
        run: |
          mapfile -t all_urls <<< "$ALL_URLS"

          for url in "${all_urls[@]}"; do
            echo "Checking $url"
            curl -fL --range 0-0 "$url" -o /dev/null
          done

      - name: Add Flathub remote
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtimes
        run: |
          flatpak --user install -y flathub org.gnome.Sdk//49
          flatpak --user install -y flathub org.gnome.Platform//49
          flatpak --user install -y flathub org.freedesktop.Sdk.Extension.openjdk21//25.08

      - name: Build and install test package
        run: |
          flatpak-builder --repo=testing-repo --force-clean build-dir io.dbeaver.DBeaverCommunity.yml
          flatpak --user remote-add --if-not-exists --no-gpg-verify db-testing-repo testing-repo
          flatpak --user install -y db-testing-repo io.dbeaver.DBeaverCommunity

      - name: Verify launch files exist
        run: |
          flatpak run --command=sh io.dbeaver.DBeaverCommunity -c \
            'test -x /app/bin/dbeaver-wrapper && test -x /app/bin/dbeaver'

      - name: Smoke test startup
        shell: bash
        run: |
          timeout 20s xvfb-run -a flatpak run io.dbeaver.DBeaverCommunity >smoke.log 2>&1 || rc=$?
          test "${rc:-0}" -eq 0 -o "${rc:-0}" -eq 124
